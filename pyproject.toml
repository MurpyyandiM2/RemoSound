[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "remosound"
version = "0.1.2"
description = "Bulk-download MyInstants sound effects into a local sound bank and match them to Remotion scenes."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "rich>=13.7",
]

[tool.setuptools]
packages = ["remosound"]

[tool.setuptools.package-data]
remosound = ["web/*.html", "web/static/*", "web/assets/*.png"]

